<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Inventory Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Inventory Management</h1>
        <nav>
            <a href="index.html" class="storefront-link">Back to Storefront</a>
        </nav>
    </header>
    
    <main class="admin-main">
        <section class="add-product-section">
            <h2>Add New Product</h2>
            <form id="product-form">
                <div class="form-group">
                    <label for="product-name">Product Name *</label>
                    <input type="text" id="product-name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="product-description">Description *</label>
                    <textarea id="product-description" name="description" rows="4" required></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="product-price">Price ($) *</label>
                        <input type="number" id="product-price" name="price" step="0.01" min="0" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="product-quantity">Quantity *</label>
                        <input type="number" id="product-quantity" name="quantity" min="0" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="product-image">Product Image *</label>
                    <input type="file" id="product-image" name="image" accept="image/*" required>
                    <div id="image-preview" class="image-preview"></div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn btn-primary">Add Product</button>
                    <button type="reset" class="btn btn-secondary">Clear Form</button>
                </div>
                
                <div id="form-message" class="form-message"></div>
            </form>
        </section>
        
        <section class="products-list-section">
            <h2>Current Products</h2>
            <div id="loading">Loading products...</div>
            <div id="error" class="error-message" style="display: none;"></div>
            <div id="products-list" class="admin-products-list"></div>
            <div id="no-products" style="display: none;" class="no-products">
                No products yet. Add your first product above!
            </div>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2026 Product Storefront Admin. Powered by AWS S3 & CloudFront.</p>
    </footer>
    
    <!-- AWS SDK for JavaScript -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1000.0.min.js"></script>
    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
